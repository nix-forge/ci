site_name: nix-forge CI
site_description: Shared Nix CI workflows and repository automation for nix-forge.
site_url: https://nix-forge.github.io/ci/
repo_url: https://github.com/nix-forge/ci
repo_name: nix-forge/ci
edit_uri: edit/main/docs/
docs_dir: ../docs
site_dir: ../dist
strict: true
hooks:
  - rewrite_source_links.py
theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  locale: en
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: info
    anchors: warn
    unrecognized_links: info
nav:
  - Overview: index.md
  - Architecture and migration: architecture.md
  - Dependency management: dependency-management.md
  - OpenSSF baseline: openssf-baseline.md
  - Releases: releases.md
  - Release runbook: releases/README.md
  - Secret management: secret-management.md
  - SLSA: slsa.md
