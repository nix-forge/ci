name: Enable dependency auto-merge
on:
  workflow_call:
permissions: {}
jobs:
  enable:
    name: enable
    if: >-
      github.event_name == 'pull_request_target' && github.repository_owner == 'nix-forge'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # Enable auto-merge after required checks.
      pull-requests: write # Update PR metadata only.
    steps:
      - name: Check dependency update policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Shared policy changes always receive human review, regardless of semver.
          files=$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files" --jq '.[].filename')
          if printf '%s\n' "$files" | grep -Eq '^\.github/(workflows/|actions/|scripts/)'; then
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo 'Shared automation updates require maintainer review.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Enable squash auto-merge after required checks
        if: steps.policy.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gh pr merge "$PR_NUMBER" --auto --squash --match-head-commit "$HEAD_SHA"
