name: SLSA source release builder

on:
  workflow_call:
    inputs:
      project_name:
        description: Lowercase release name used for the archive and artifact.
        required: true
        type: string
      release_notes_directory:
        description: Directory containing the tag-specific release note.
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: build and attest source archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Request a short-lived Sigstore signing identity.
      attestations: write # Publish provenance to GitHub's attestation store.
    env:
      PROJECT_NAME: ${{ inputs.project_name }}
      RELEASE_NOTES_DIRECTORY: ${{ inputs.release_notes_directory }}
      TAG: ${{ github.ref_name }}
      COMMIT: ${{ github.sha }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: false
      - name: Validate release inputs
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PROJECT_NAME" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          [[ "$RELEASE_NOTES_DIRECTORY" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$RELEASE_NOTES_DIRECTORY" != /* && "$RELEASE_NOTES_DIRECTORY" != *..* ]]
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          [[ "$tag_commit" == "$COMMIT" ]]
          notes="$RELEASE_NOTES_DIRECTORY/$TAG.md"
          test -s "$notes"
          grep -q '^## Changelog$' "$notes"
      - name: Create source archive and manifest
        run: |
          set -euo pipefail
          archive="$PROJECT_NAME-$TAG.tar.gz"
          notes="$RELEASE_NOTES_DIRECTORY/$TAG.md"
          git archive --format=tar.gz \
            --prefix="$PROJECT_NAME-$TAG/" \
            --output="$archive" \
            "$COMMIT"
          sha256sum "$archive" > "$archive.sha256"
          archive_sha256="$(awk '{print $1}' "$archive.sha256")"
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'source_ref=%s\n' "$GITHUB_REF"
            printf 'source_commit=%s\n' "$COMMIT"
            printf 'workflow_ref=%s\n' "$GITHUB_WORKFLOW_REF"
            printf 'builder_workflow=%s\n' 'nix-forge/ci/.github/workflows/slsa-source-release.yml'
            printf 'provenance_predicate=%s\n' 'https://slsa.dev/provenance/v1'
            printf 'archive=%s\n' "$archive"
            printf 'archive_sha256=%s\n' "$archive_sha256"
            printf 'release_notes=%s\n' "$notes"
          } > release-manifest.txt
          cp "$notes" release-notes.md
      - name: Create SLSA build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ inputs.project_name }}-${{ github.ref_name }}.tar.gz
            ${{ inputs.project_name }}-${{ github.ref_name }}.tar.gz.sha256
            release-manifest.txt
      - name: Export portable SLSA provenance
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          archive="$PROJECT_NAME-$TAG.tar.gz"
          provenance="$PROJECT_NAME-$TAG.intoto.jsonl"
          cp "$PROVENANCE_BUNDLE" "$provenance"
          test -s "$provenance"
          gh attestation verify "$archive" \
            --repo "$GITHUB_REPOSITORY" \
            --bundle "$provenance"
      - name: Upload release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.project_name }}-slsa-release
          path: |
            ${{ inputs.project_name }}-${{ github.ref_name }}.tar.gz
            ${{ inputs.project_name }}-${{ github.ref_name }}.tar.gz.sha256
            ${{ inputs.project_name }}-${{ github.ref_name }}.intoto.jsonl
            release-manifest.txt
            release-notes.md
          if-no-files-found: error
          retention-days: 7
