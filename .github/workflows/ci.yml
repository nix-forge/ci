name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@021c8a1bd3570eb21f5c20a054812b0c4d9ca614 # v3.22.3
      - name: Test shared actions and check workflow security
        run: nix develop --command bash scripts/check.sh
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write # Upload the shared automation scan.
    # Both local syntaxes bind the caller commit; pinned actionlint lacks $/ support.
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository]
    with:
      languages: python,actions
