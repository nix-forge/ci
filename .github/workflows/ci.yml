name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: validate
    # The merge queue validates changes; pushes refresh the CodeQL baseline only.
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nix-forge/ci/actions/setup-nix@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
      - name: Test shared actions and check workflow security
        run: nix flake check --print-build-logs
      - name: Test attribute discovery against real Nix
        run: nix develop --command python3 scripts/test-nix-attribute-selection.py
  codeql:
    name: CodeQL
    permissions:
      contents: read
      security-events: write # Upload the shared automation scan.
    # Both local syntaxes bind the caller commit; pinned actionlint lacks $/ support.
    uses: ./.github/workflows/codeql.yml # zizmor: ignore[self-repository]
    with:
      languages: python,actions
  queue-completion:
    continue-on-error: true
    name: Queue completion callback
    if: always() && github.event_name == 'workflow_dispatch' && startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/', github.event.repository.default_branch))
    needs: [validate, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      actions: write # Notify the trusted default-branch reconciler.
    steps:
      - name: Notify trusted queue reconciler
        uses: nix-forge/ci/actions/queue-completion@78ee44eba73081183f51c85194c6dd9382feb60f # v2.5.0
