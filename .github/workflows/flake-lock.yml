name: Flake lock health
on:
  workflow_call:
    inputs:
      lockfile:
        description: Lockfile relative to the caller repository.
        type: string
        required: true
permissions: {}
jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate lockfile input
        env:
          LOCKFILE: ${{ inputs.lockfile }}
        run: |
          set -euo pipefail
          if [[ "$LOCKFILE" == /* || "$LOCKFILE" == *..* || ! "$LOCKFILE" =~ ^[A-Za-z0-9._/-]+\.lock$ ]]; then
            printf 'Invalid lockfile input: %s\n' "$LOCKFILE" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/flake-checker-action@786422608c7bded2bbc9741ad9f91356842bf520 # v14
        with:
          flake-lock-path: ${{ inputs.lockfile }}
          ignore-missing-flake-lock: false
          fail-mode: true
          send-statistics: false
