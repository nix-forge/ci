name: Dependency review
on:
  workflow_call:
    inputs:
      base-ref:
        description: Base revision for manual dispatch; empty on ordinary PR events.
        type: string
        default: ''
      head-ref:
        description: Head revision for manual dispatch; empty on ordinary PR events.
        type: string
        default: ''
permissions: {}
jobs:
  review:
    name: review
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          base-ref: ${{ inputs.base-ref }}
          head-ref: ${{ inputs.head-ref }}
          fail-on-severity: high
