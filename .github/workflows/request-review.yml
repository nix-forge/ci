name: Request human PR review
on:
  workflow_call:
    inputs:
      reviewer:
        description: Maintainer login to request, excluding their own PRs.
        type: string
        default: IanHollow
permissions: {}
jobs:
  request:
    name: request
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.pull_request.user.type != 'Bot'
      && github.event.pull_request.user.login != inputs.reviewer
      && github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # Update PR metadata only.
    steps:
      - name: Request maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ inputs.reviewer }}
        run: gh pr edit "$PR_NUMBER" --add-reviewer "$REVIEWER"
