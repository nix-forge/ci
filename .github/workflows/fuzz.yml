name: Fuzz CI partitioning
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '43 8 * * 1'
  workflow_dispatch:
permissions: {}
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  partitioning:
    name: Fuzz check partitioning
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./actions/fuzz-atheris
        with:
          target: fuzz/partition_fuzzer.py
