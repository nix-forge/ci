name: CodeQL
on:
  workflow_call:
    inputs:
      languages:
        description: CodeQL language identifiers supported by build-mode none.
        type: string
        default: python
permissions: {}
jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Upload code scanning results.
    steps:
      - name: Validate CodeQL languages
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          if [[ -z "$LANGUAGES" || ! "$LANGUAGES" =~ ^[A-Za-z0-9+._,#-]+$ ]]; then
            printf 'Invalid CodeQL languages input: %s\n' "$LANGUAGES" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ inputs.languages }}
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # Queue refs can disappear after another group merges. Query execution
          # still gates the queue; stable PR and default-branch scans publish SARIF.
          upload: ${{ github.event_name != 'merge_group' && !startsWith(github.ref, format('refs/heads/gh-readonly-queue/{0}/', github.event.repository.default_branch)) }}
