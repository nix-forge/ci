name: CodeQL
on:
  workflow_call:
    inputs:
      languages:
        description: CodeQL language identifiers supported by build-mode none.
        type: string
        default: python
permissions: {}
jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # Upload code scanning results.
    steps:
      - name: Validate CodeQL languages
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          set -euo pipefail
          if [[ -z "$LANGUAGES" || ! "$LANGUAGES" =~ ^[A-Za-z0-9+._,#-]+$ ]]; then
            printf 'Invalid CodeQL languages input: %s\n' "$LANGUAGES" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ inputs.languages }}
          build-mode: none
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
