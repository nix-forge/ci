name: NUR compatibility
on:
  workflow_call:
permissions: {}
jobs:
  evaluate:
    name: NUR (${{ matrix.nixpkgs }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        nixpkgs: [locked, unstable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Evaluate NUR entry point
        env:
          NIXPKGS_SOURCE: ${{ matrix.nixpkgs }}
        run: python3 scripts/check-nur.py --nixpkgs "$NIXPKGS_SOURCE" --output "$RUNNER_TEMP/nur-results"
      - name: Preserve evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nur-${{ matrix.nixpkgs }}
          path: ${{ runner.temp }}/nur-results
          if-no-files-found: warn
          retention-days: 7
