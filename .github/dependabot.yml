version: 2
updates:
  - package-ecosystem: github-actions
    directories: [/, /actions/*]
    schedule:
      interval: weekly
    groups:
      shared-ci:
        patterns: ["nix-forge/ci", "nix-forge/ci/*"]
        exclude-patterns:
          - "nix-forge/ci/.github/workflows/slsa-*"
          - "nix-forge/ci/actions/repository-checks"
      actions-minor-patch:
        # CodeQL init and analyze share runtime state and must update together.
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
