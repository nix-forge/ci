version: 2
updates:
  - package-ecosystem: github-actions
    directories: [/, /actions/*]
    schedule:
      interval: weekly
    groups:
      shared-ci:
        patterns: ["nix-forge/ci"]
      actions-minor-patch:
        # CodeQL init and analyze share runtime state and must update together.
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
