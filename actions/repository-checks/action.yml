name: Repository checks
description: Run repository-owned hooks and scan HEAD history and committed files in one Nix shell.
inputs:
  dev-shell:
    description: Repository development shell containing the hook and scanner tools.
    default: default
  partitions:
    description: Auto-discover tracked nested flakes, or provide explicit newline-separated paths.
    default: auto
  hook-runner:
    description: Hook executable provided by the repository shell, prek or pre-commit.
    default: prek
  history-baseline:
    description: Optional reviewed Gitleaks history baseline. Never applied to the current tree.
    default: ''
  publication-script:
    description: Optional repository-owned scanner implementing additional publication policy.
    default: ''
runs:
  using: composite
  steps:
    - name: Validate repository-check inputs
      shell: bash
      env:
        CHECK_DEV_SHELL: ${{ inputs.dev-shell }}
        CHECK_HOOK_RUNNER: ${{ inputs.hook-runner }}
        CHECK_PUBLICATION_SCRIPT: ${{ inputs.publication-script }}
      run: |
        set -euo pipefail
        if [[ ! "$CHECK_DEV_SHELL" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
          printf 'Invalid dev-shell input: %s\n' "$CHECK_DEV_SHELL" >&2
          exit 1
        fi
        if [[ "$CHECK_HOOK_RUNNER" != prek && "$CHECK_HOOK_RUNNER" != pre-commit ]]; then
          printf 'Invalid hook-runner input: %s\n' "$CHECK_HOOK_RUNNER" >&2
          exit 1
        fi
        if [[ -n "$CHECK_PUBLICATION_SCRIPT" && ( "$CHECK_PUBLICATION_SCRIPT" == /* || "$CHECK_PUBLICATION_SCRIPT" == *..* || ! "$CHECK_PUBLICATION_SCRIPT" =~ ^[A-Za-z0-9._/-]+$ ) ]]; then
          printf 'Invalid publication-script input: %s\n' "$CHECK_PUBLICATION_SCRIPT" >&2
          exit 1
        fi
    - name: Run hooks and publication checks
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        CHECK_DEV_SHELL: ${{ inputs.dev-shell }}
        CHECK_PARTITIONS: ${{ inputs.partitions }}
        CHECK_HOOK_RUNNER: ${{ inputs.hook-runner }}
        CHECK_HISTORY_BASELINE: ${{ inputs.history-baseline }}
        CHECK_PUBLICATION_SCRIPT: ${{ inputs.publication-script }}
      run: |
        if [[ "$CHECK_PARTITIONS" == auto ]]; then
          python3 "$ACTION_PATH/../../scripts/repository_inventory.py" partitions --materialize
        else
          while IFS= read -r partition; do
            if [[ -n "$partition" ]]; then
              nix store add-path -- "$partition"
            fi
          done <<< "$CHECK_PARTITIONS"
        fi
        nix develop ".#$CHECK_DEV_SHELL" --command bash "$ACTION_PATH/../../scripts/repository-checks.sh"
