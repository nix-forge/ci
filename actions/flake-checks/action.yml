name: Native flake checks
description: Discover and build every native flake check with bounded evaluation memory.
inputs:
  system:
    description: Native Nix system supported by this runner.
    required: true
  checks-output:
    description: Flake output containing native CI checks, indexed by system.
    default: checks
  cores:
    description: Build cores per check, with zero selecting all available cores.
    default: '2'
  base-revision:
    description: Optional base commit used to skip checks with unchanged derivations.
    default: ''
runs:
  using: composite
  steps:
    - name: Discover and build native checks
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TARGET_SYSTEM: ${{ inputs.system }}
        CHECKS_OUTPUT: ${{ inputs.checks-output }}
        BUILD_CORES: ${{ inputs.cores }}
        BASE_REVISION: ${{ inputs.base-revision || github.event.inputs.base_sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      run: |
        python3 "$ACTION_PATH/../../scripts/repository_inventory.py" partitions --materialize
        python3 "$ACTION_PATH/../../scripts/run-flake-checks.py" \
          --system "$TARGET_SYSTEM" \
          --cores "$BUILD_CORES" \
          --output "$CHECKS_OUTPUT" \
          --base-revision "$BASE_REVISION"
