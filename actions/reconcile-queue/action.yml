name: Reconcile merge queue
description: Admit eligible automation PRs after metadata and inert workflow-source validation.
inputs:
  workflows:
    description: JSON array of workflow filenames that must pass.
    required: true
  automation-branch:
    description: Optional same-repository github-actions bot branch eligible for admission.
    default: ''
  package-source-checks:
    description: Opt-in JSON workflow-to-required-job map for same-repository package updater source PRs.
    default: '{}'
  base-sha-workflows:
    description: JSON array of workflows accepting the base_sha dispatch input.
    default: '[]'
  source-run-id:
    description: Optional dispatch completion notification.
    default: ''
runs:
  using: composite
  steps:
    - name: Validate queue inputs
      shell: bash
      env:
        PACKAGE_SOURCE_CHECKS: ${{ inputs.package-source-checks }}
        AUTOMATION_BRANCH: ${{ inputs.automation-branch }}
        BASE_SHA_WORKFLOWS: ${{ inputs.base-sha-workflows }}
        QUEUE_WORKFLOWS: ${{ inputs.workflows }}
        SOURCE_RUN_ID: ${{ inputs.source-run-id }}
      run: |
        set -euo pipefail
        if [[ -n "$SOURCE_RUN_ID" && ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
          printf 'Invalid source-run-id input: %s\n' "$SOURCE_RUN_ID" >&2
          exit 1
        fi
        if [[ -n "$AUTOMATION_BRANCH" && ( "$AUTOMATION_BRANCH" == /* || "$AUTOMATION_BRANCH" == *..* || ! "$AUTOMATION_BRANCH" =~ ^[A-Za-z0-9._/-]{1,256}$ ) ]]; then
          printf 'Invalid automation-branch input: %s\n' "$AUTOMATION_BRANCH" >&2
          exit 1
        fi
        python3 - "$QUEUE_WORKFLOWS" "$BASE_SHA_WORKFLOWS" "$PACKAGE_SOURCE_CHECKS" <<'PY'
        import json
        import re
        import sys

        workflow_pattern = re.compile(r"^[A-Za-z0-9._/-]+\.yml$")
        for label, value in zip(("workflows", "base-sha-workflows"), sys.argv[1:3]):
            entries = json.loads(value)
            if not isinstance(entries, list) or not all(
                isinstance(entry, str) and workflow_pattern.fullmatch(entry)
                for entry in entries
            ):
                raise SystemExit(f"Invalid {label} input")
        source = json.loads(sys.argv[3])
        if not isinstance(source, dict) or any(
            not workflow_pattern.fullmatch(key) or not isinstance(jobs, list) or not jobs
            or any(not isinstance(job, str) or not job or len(job) > 256 for job in jobs)
            or len(jobs) != len(set(jobs))
            for key, jobs in source.items()
        ):
            raise SystemExit("Invalid package-source-checks input")
        contexts = [job for jobs in source.values() for job in jobs]
        if len(contexts) != len(set(contexts)):
            raise SystemExit("Source required job names must be unique")
        if source and (set(source) != set(json.loads(sys.argv[1])) or "DCO sign-off" not in source.get("dco.yml", [])):
            raise SystemExit("Source checks must cover every workflow, including actual source DCO")
        PY
    - name: Set up queue validation Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: '3.14'
    - name: Install reviewed YAML parser
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: >-
        python3 -m pip --isolated install --disable-pip-version-check --no-deps --only-binary=:all:
        --require-hashes --index-url https://pypi.org/simple
        --requirement "$ACTION_PATH/requirements.txt"
    - name: Reconcile verified queue results
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        PACKAGE_SOURCE_CHECKS: ${{ inputs.package-source-checks }}
        AUTOMATION_BRANCH: ${{ inputs.automation-branch }}
        BASE_SHA_WORKFLOWS: ${{ inputs.base-sha-workflows }}
        QUEUE_WORKFLOWS: ${{ inputs.workflows }}
        SOURCE_RUN_ID: ${{ inputs.source-run-id }}
      run: python3 "$ACTION_PATH/../../scripts/reconcile-queue.py"
